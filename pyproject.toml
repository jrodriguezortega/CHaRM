[project]
name = "charm"
version = "1.0.0"
description = "CHaRM: segmentation-free 3D landmark detection on intraoral scans"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "José Rodríguez-Ortega", email = "e.jrodriguez98@go.ugr.es" },
]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "hydra-colorlog==1.2.0",
    "hydra-core==1.3.2",
    "lightning==2.4.0",
    "mlflow>=2.22,<3",
    "numpy==1.26.4",
    "rich==13.7.1",
    "tensorboard>=2.17",
    "torch==2.7.1",
    "vedo==2024.5.2",
]

[project.scripts]
charm-preprocess = "charm.cli.preprocess:main"
charm-train = "charm.cli.train:main"
charm-eval = "charm.cli.evaluate:main"
charm-predict = "charm.cli.predict:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12.12",
]
cu126 = ["torch==2.7.1"]
cpu = ["torch==2.7.1"]

[build-system]
requires = ["uv_build>=0.8.13,<0.9"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "cu126"]
conflicts = [[{ group = "cpu" }, { group = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
ignore = [
    "N803",  # tensor-shaped arguments such as `B, N` are kept upper case
    "N806",
    "N812",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
